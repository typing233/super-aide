# 每次推送和拉取请求：跑单元测试，顺便编译一下安装器（确认没编译错误）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHONIOENCODING: utf-8   # Windows 机器的输出编码是 cp1252：不设的话，打印中文（比如测试失败的说明）会出错

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # 从 v8 起只发完整版本号的标签
        with:
          python-version: "3.12"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen

      - name: 单元测试
        run: uv run python -m pytest -q

      - name: 安卓端的路由和经验库对照数据是最新的
        run: uv run python scripts/android/gen_fixtures.py --check

      - name: 编译安装器
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Repo "${{ github.repository }}"
