# 发版：推送 v 开头的标签（比如 v0.2.0）时自动做完：
#   1. 跑单元测试；
#   2. 生成随包发布的锁定版本清单和仓库信息（scripts/release/prepare.py，标签必须和 pyproject.toml 的版本一致）；
#   3. 打包（wheel + sdist），编译安装器 SuperAideSetup.exe；
#   4. 建 GitHub Release（安装包、安装器、校验和）；
#   5. 发布到 PyPI（用 PyPI 的 Trusted Publishing，不用保存密码或令牌）。
#
# 第一次用之前要做一次设置，见 README 的"发版"一节。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8   # Windows 机器的输出编码是 cp1252：不设的话，打印中文（比如测试失败的说明）会出错

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # 从 v8 起只发完整版本号的标签
        with:
          python-version: "3.12"

      - name: 单元测试
        run: |
          uv sync --frozen
          uv run python -m pytest -q

      - name: 生成锁定版本清单和发布信息
        run: uv run python scripts/release/prepare.py --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"

      - name: 打包
        run: uv build --out-dir dist

      - name: 编译安装器
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Repo "${{ github.repository }}" -Out installer-dist/SuperAideSetup.exe

      # 代码签名（可选）：SignPath Foundation 给开源项目免费签名（https://signpath.org）。
      # 申请通过后，按 SignPath 的说明在这里加上它的 GitHub Action（提交 installer-dist/SuperAideSetup.exe 签名、
      # 等它签完再继续），并在仓库的 Secrets 里放 SIGNPATH_API_TOKEN。没签名的安装器也能用，只是 Windows 会多问一句。

      - name: 校验和
        shell: pwsh
        run: |
          Get-FileHash dist/*.whl, dist/*.tar.gz, installer-dist/SuperAideSetup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content installer-dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer-dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          # 写在自动生成的更新说明前面
          body: |
            **下载 `SuperAideSetup.exe`，双击安装**（约 100 KB，运行环境装的时候再下载）。安装器还没有代码签名，Windows 提示"已保护你的电脑"时点 **更多信息 → 仍要运行**。已经装过的：设置 → 通用 → 版本 → 更新。

            **Download `SuperAideSetup.exe` and run it** (about 100 KB; it fetches the runtime while installing). The installer isn't code-signed yet: if Windows says "Windows protected your PC", click **More info → Run anyway**. Already installed? Settings → General → Version → Update.
          generate_release_notes: true
          files: |
            artifacts/installer/SuperAideSetup.exe
            artifacts/installer/SHA256SUMS.txt
            artifacts/dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
