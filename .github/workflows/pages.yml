# 官网（GitHub Pages，https://typing233.github.io/super-aide/）：website/ 有改动、发完新版本、或者手动触发时发布。
# 发布时把最新版的安装器放到网站上（download/SuperAideSetup.exe），再写一份 latest.json（版本、大小、校验和）。
# 网页上的下载按钮优先用网站上这份：国内访问 github.io 往往比 github.com 的下载链接稳。
#
# 第一次用之前，在仓库的 Settings → Pages 里把 Source 选成 "GitHub Actions"。
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 发版失败就不更新网站
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 放上最新版的安装器
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p website/download
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          tag=$(jq -r .tag_name <<<"$release")
          url=$(jq -r '.assets[] | select(.name == "SuperAideSetup.exe") | .browser_download_url' <<<"$release")
          curl -fsSL --retry 3 "$url" -o website/download/SuperAideSetup.exe
          jq -n \
            --arg version "${tag#v}" \
            --arg tag "$tag" \
            --arg published "$(jq -r .published_at <<<"$release")" \
            --argjson size "$(stat -c %s website/download/SuperAideSetup.exe)" \
            --arg sha256 "$(sha256sum website/download/SuperAideSetup.exe | cut -d' ' -f1)" \
            --arg github "$url" \
            '{version: $version, tag: $tag, published: $published, size: $size, sha256: $sha256,
              file: "download/SuperAideSetup.exe", github: $github}' > website/latest.json
          cat website/latest.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deploy
        uses: actions/deploy-pages@v5
